<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High-Ticket Sales Offers Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080c; --card:#11111a; --ink:#ffffff; --body:#d9d9e3; --muted:#9a9aab; --line:#2a2a36;
    --pink:#ff45b5; --cyan:#00e5ff; --white:#ffffff;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:36px 20px 70px}
  .serif{font-family:"Cinzel",Georgia,serif}

  header{display:flex;gap:22px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:18px}
  .logo{width:64px;height:62px;mix-blend-mode:lighten;flex:none}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);margin:0 0 6px}
  h1{font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:clamp(28px,5vw,46px);line-height:1.05;margin:0;color:#fff;letter-spacing:.01em}
  h1 .p{color:var(--pink)} h1 .c{color:var(--cyan)}
  .tagline{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .count{font-size:15px;color:var(--muted);letter-spacing:.03em}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;font:inherit;font-size:15px;color:#fff;padding:13px 14px 13px 42px;border:2px solid var(--line);border-radius:12px;background:var(--card);outline:none}
  .search input::placeholder{color:#6f6f80}
  .search input:focus{border-color:var(--cyan)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

  .roles{display:inline-flex;gap:4px;padding:4px;border:2px solid var(--line);border-radius:14px;margin:0 0 12px;background:var(--card)}
  .role{font-family:"Cinzel",Georgia,serif;font-size:15px;font-weight:700;padding:9px 18px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;letter-spacing:.02em}
  .role:hover{color:#fff}
  .role.on{background:#fff;color:#06060a}
  .role.on[data-r="Closer"]{background:var(--cyan)}
  .role.on[data-r="Setter"]{background:var(--pink)}
  .role .n{font-family:"Inter",sans-serif;font-size:11px;font-weight:700;opacity:.65;margin-left:6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .chip{font:inherit;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:8px 13px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--body);cursor:pointer}
  .chip:hover{border-color:#55556a}
  .chip.on{background:var(--cyan);border-color:var(--cyan);color:#06060a}

  .list{display:flex;flex-direction:column;gap:16px}
  .card{--acc:var(--pink);background:var(--card);border:2px solid var(--acc);border-radius:14px;transition:transform .15s,box-shadow .15s}
  .card.a1{--acc:var(--cyan)} .card.a2{--acc:var(--white)}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 30px -12px var(--acc)}
  .row{display:flex;align-items:center;gap:20px;padding:20px 22px;cursor:pointer}
  .num{flex:none;width:52px;font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:36px;color:var(--acc);line-height:1}
  .main{flex:1;min-width:0}
  .label{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:0 0 6px}
  .title{font-family:"Cinzel",Georgia,serif;font-size:20px;font-weight:700;color:#fff;margin:0 0 8px;line-height:1.25;letter-spacing:.01em}
  .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
  .meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .meta svg{width:14px;height:14px;opacity:.7}
  .side{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex:none}
  .apply{display:inline-block;background:var(--acc);color:#06060a;text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:13px 18px;border-radius:10px;transition:filter .15s,transform .1s}
  .apply:hover{filter:brightness(1.12)}
  .apply:active{transform:translateY(1px)}
  .more{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;cursor:pointer;padding:2px}
  .more:hover{color:#fff}
  .flag{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);border:1px solid var(--pink);padding:3px 8px;border-radius:6px}

  .details{display:none;border-top:1px solid var(--line);padding:18px 22px 22px 94px;font-size:14.5px;line-height:1.65;color:var(--body)}
  .card.open .details{display:block}
  .details h4{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin:16px 0 4px}
  .details h4:first-child{margin-top:0}
  .details p{margin:0}
  .details ul{margin:2px 0 0;padding-left:18px}
  .details li::marker{color:var(--acc)}
  .details .warn{border-left:3px solid var(--pink);background:rgba(255,69,181,.08);border-radius:8px;padding:11px 14px;margin-top:16px}
  .details .warn strong{color:var(--pink);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-right:6px}
  .details a{color:var(--cyan);font-weight:600}

  .empty{text-align:center;color:var(--muted);padding:40px 0;display:none}
  .forlife{margin-top:30px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 26px;border-radius:14px;background:linear-gradient(90deg,var(--pink),var(--cyan));color:#06060a}
  .forlife .serif{font-size:22px;font-weight:700;white-space:nowrap}
  .forlife span:last-child{font-weight:600;font-size:14.5px}

  @media (max-width:640px){
    .row{flex-wrap:wrap;padding:18px;gap:14px}
    .num{width:auto;font-size:28px}
    .main{flex-basis:calc(100% - 60px)}
    .side{flex-direction:row;width:100%;justify-content:space-between;align-items:center}
    .apply{flex:1;text-align:center}
    .details{padding:16px 18px 20px}
    .title{font-size:17px}
  }
  .acct{display:flex;justify-content:flex-end;align-items:center;gap:14px;font-size:13px;color:var(--muted);margin-bottom:14px;min-height:20px}
  .acct a,.acct button{font:inherit;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);background:none;border:0;cursor:pointer;text-decoration:none;padding:0}
  .acct button{color:var(--muted)} .acct button:hover{color:#fff}
  .gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px}
  .gate[hidden]{display:none}
  .gate-card{max-width:440px;width:100%;text-align:center;border:2px solid var(--line);border-radius:18px;background:var(--card);padding:38px 30px}
  .gate-card img{width:70px;height:68px;mix-blend-mode:lighten}
  .gate-card .eyebrow{margin-top:14px}
  .gate-card h2{font-family:"Cinzel",Georgia,serif;color:#fff;font-size:26px;margin:4px 0 12px;line-height:1.2}
  .gate-card p{color:var(--body);font-size:15px;line-height:1.6;margin:0 0 22px}
  .gbtn{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:700;font-size:15px;background:#fff;color:#1f1f1f;border:0;border-radius:10px;padding:13px 20px;cursor:pointer}
  .gbtn:hover{filter:brightness(.94)}
  .gbtn svg{width:18px;height:18px}
  .linkbtn{display:block;margin:16px auto 0;font:inherit;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;margin:10px auto 18px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <img src="/assets/logo.png" alt="Aescendex">
    <p class="eyebrow" id="gate-eyebrow">The Offers Board</p>
    <h2 id="gate-title">Loading…</h2>
    <div class="spinner" id="gate-spin"></div>
    <p id="gate-text"></p>
    <button class="gbtn" id="gate-signin" hidden>
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>
    <button class="linkbtn" id="gate-out" hidden>Use a different account</button>
  </div>
</div>

<div class="wrap">
  <div class="acct" id="acct"></div>
  <header>
    <div class="brand">
      <img class="logo" alt="Aescendex" src="/assets/logo.png">
      <div>
        <p class="eyebrow">The Offers Board</p>
        <h1><span class="p">Set.</span> <span class="c">Close.</span> Ascend.</h1>
        <div class="tagline">Aescendex Sales Training</div>
      </div>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div class="toolbar">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search by niche, company or pay…" aria-label="Search offers">
    </label>
  </div>
  <div class="roles" id="roles">
    <button class="role on" data-r="All">All Roles</button>
    <button class="role" data-r="Closer">Closers</button>
    <button class="role" data-r="Setter">Setters</button>
  </div>
  <div class="chips" id="chips"></div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">No offers match that search.</div>

  <div class="forlife"><span class="serif">For Setters &amp; Closers</span><span>Tap any offer for the full breakdown · Apply Now takes you straight to the company's application</span></div>
</div>

<script>
/* ===== OFFERS: newest first. Add new ones to the top of this list. ===== */
let OFFERS = [];

const ic = {
  building:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12 12 20l-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const listEl = document.getElementById('list');
let filter = 'All';
let role = 'All';
const hasRole = (o, r) => r === 'All' || o.role.toLowerCase().includes(r.toLowerCase());

function card(o, i, pos){
  const d = [];
  d.push(`<h4>Pay</h4><p>${esc(o.pay)}</p>`);
  d.push(`<h4>About the offer</h4><p>${esc(o.summary)}</p>`);
  if (o.schedule) d.push(`<h4>Schedule</h4><p>${esc(o.schedule)}</p>`);
  if (o.duties) d.push(`<h4>What you'll do</h4><ul>${o.duties.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
  if (o.requirements) d.push(`<h4>Requirements</h4><ul>${o.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
  if (o.process) d.push(`<h4>Hiring process</h4><p>${esc(o.process)}</p>`);
  if (o.moreInfo) d.push(`<h4>More info</h4><p><a href="${esc(o.moreInfo)}" target="_blank" rel="noopener">Open the offer details doc</a></p>`);
  if (o.warn) d.push(`<div class="warn"><strong>Worth checking:</strong> ${esc(o.warn)}</div>`);
  return `<article class="card a${pos%3}" data-i="${i}">
    <div class="row">
      <div class="num">${String(pos+1).padStart(2,"0")}</div>
      <div class="main">
        <p class="label">${esc(o.company)}</p>
        <h2 class="title">${esc(o.headline)}</h2>
        <div class="meta">
                    <span>${ic.user}${esc(o.role)}</span>
          <span>${ic.tag}${esc(o.niche)}</span>
          <span>${ic.pin}${esc(o.location)}</span>
          <span>${ic.clock}${esc(o.type)}</span>
        </div>
      </div>
      <div class="side">
        <a class="apply" href="${esc(o.apply)}" target="_blank" rel="noopener">Apply Now</a>
        ${o.warn ? '<span class="flag">Read first</span>' : ''}
        <button class="more" type="button">Details ▾</button>
      </div>
    </div>
    <div class="details">${d.join('')}</div>
  </article>`;
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const shown = OFFERS.map((o,i)=>[o,i]).filter(([o]) =>
    hasRole(o, role) &&
    (filter==='All' || o.category===filter) &&
    (!q || JSON.stringify(o).toLowerCase().includes(q)));
  listEl.innerHTML = shown.map(([o,i],pos) => card(o,i,pos)).join('');
  document.getElementById('count').textContent = `${shown.length} offer${shown.length===1?'':'s'} · newest first`;
  const empty = document.getElementById('empty');
  empty.textContent = (role === 'Setter' && !OFFERS.some(o => hasRole(o, 'Setter')))
    ? 'No setter offers yet. New ones will show up here as they come in.'
    : 'No offers match that search.';
  empty.style.display = shown.length ? 'none' : 'block';
}

window.startBoard = function (data) {
  OFFERS = data;
  const cats = ['All', ...new Set(OFFERS.map(o=>o.category))];
  document.getElementById('chips').innerHTML = cats.map(c=>`<button class="chip${c==='All'?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  document.getElementById('chips').addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    filter = b.dataset.c;
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===b));
    render();
  });
  document.querySelectorAll('.role').forEach(b => {
    const n = b.dataset.r === 'All' ? OFFERS.length : OFFERS.filter(o => hasRole(o, b.dataset.r)).length;
    b.insertAdjacentHTML('beforeend', `<span class="n">${n}</span>`);
  });
  document.getElementById('roles').addEventListener('click', e=>{
    const b = e.target.closest('.role'); if(!b) return;
    role = b.dataset.r;
    document.querySelectorAll('.role').forEach(x=>x.classList.toggle('on', x===b));
    render();
  });
  document.getElementById('q').addEventListener('input', render);
  listEl.addEventListener('click', e=>{
    if (e.target.closest('a')) return;           // Apply Now / links open normally
    const c = e.target.closest('.card'); if(!c) return;
    c.classList.toggle('open');
    const btn = c.querySelector('.more');
    btn.textContent = c.classList.contains('open') ? 'Hide ▴' : 'Details ▾';
  });
  render();
};
</script>
<script type="module">
import { configured, auth, onAuthStateChanged, googleSignIn, logOut, ensureUserRecord, esc } from "/assets/auth.js";

const $ = (id) => document.getElementById(id);
function gate({ title, text = "", eyebrow = "The Offers Board", signin = false, out = false, spin = false }) {
  $("gate").hidden = false;
  $("gate-eyebrow").textContent = eyebrow;
  $("gate-title").textContent = title;
  $("gate-text").textContent = text;
  $("gate-text").hidden = !text;
  $("gate-signin").hidden = !signin;
  $("gate-out").hidden = !out;
  $("gate-spin").hidden = !spin;
}

$("gate-signin").addEventListener("click", async () => {
  try { await googleSignIn(); }
  catch (e) {
    if (e?.code !== "auth/popup-closed-by-user" && e?.code !== "auth/cancelled-popup-request")
      gate({ title: "Sign-in didn't work", text: "Please allow pop-ups for this site and try again.", signin: true });
  }
});
$("gate-out").addEventListener("click", () => logOut());

if (!configured) {
  gate({ title: "Almost ready", text: "Student sign-in is being set up. Check back soon." });
} else {
  onAuthStateChanged(auth, async (user) => {
    $("acct").innerHTML = "";
    if (!user) {
      gate({ title: "Members only", text: "Sign in with Google to see the offers. New students get access once Aescendex approves them.", signin: true });
      return;
    }
    gate({ title: "Checking your access…", spin: true });
    try {
      await ensureUserRecord(user);
      const token = await user.getIdToken();
      const res = await fetch("/api/offers", { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.status === "approved") {
        $("acct").innerHTML = `<span>${esc(user.email)}</span>` +
          (data.staff ? `<a href="/staff/">Staff page</a>` : "") +
          `<button id="acct-out">Sign out</button>`;
        $("acct-out").onclick = () => logOut();
        window.startBoard(data.offers || []);
        $("gate").hidden = true;
      } else if (data.status === "removed") {
        gate({ title: "Access removed", text: `Your access for ${user.email} has been removed. Reach out to the Aescendex team if you think this is a mistake.`, out: true });
      } else if (data.status === "pending") {
        gate({ eyebrow: "You're on the list", title: "Waiting for approval", text: `You're signed in as ${user.email}. The Aescendex team will review your request, and the offers will show up here once you're approved.`, out: true });
      } else {
        gate({ title: "Please sign in again", text: "Your session expired.", signin: true, out: true });
      }
    } catch (e) {
      console.error(e);
      gate({ title: "Something went wrong", text: "We couldn't check your access. Refresh the page to try again.", out: true });
    }
  });
}
</script>
</body>
</html>
